			const ed11y = new Ed11y.Ed11y({
				//extraPlaceholderStopWords: 'placeholder, alt text, add alt text, tbd, please add, todo, to do',
				alertMode : 'assertive',
				//baseFontSize: 18,

				ignoreContentOutsideRoots: true,
				//outlineExclude : '.utility', // @todo CMS this syntax changed for Sa11y to the below.
				outlineIgnore: '.utility',

				splitConfiguration: {
					showDev: true,
					devChecks: ['QA_IN_PAGE_LINK'],

						checkRoot: 'body',

				lang: Ed11yLangEn.lang,
				linkIgnoreStrings: ['opens in new window','download'], // @todo CMS was regex.
				linkIgnoreSelector: '.link-purpose',
				embeddedContent: '#embed',

				ignoreByTest: {

				autoDetectShadowComponents: true,
				editLinks: editLinks,
				//showDismissed : true,
				altPlaceholder: ['This image has an empty alt attribute;'], // @todo CMS was string.

				//ignoreTests: ['headingLevelSkipped'],
				// syncedDismissals : {},
				//allowOK: false,
				//allowHide: false,
				//ignoreAllIfAbsent : 'maain',
				//ignoreAllIfPresent : 'main',
				//preventCheckingIfAbsent : 'maian',

				checks: {

					HEADING_SKIPPED_LEVEL: true,
					HEADING_EMPTY_WITH_IMAGE: true,
					HEADING_EMPTY: true,
					HEADING_FIRST: true,
					HEADING_LONG: {

					HEADING_MISSING_ONE: true,

					ALT_MAYBE_BAD: {
						minLength: 15,
					},
					LINK_ALT_MAYBE_BAD: {

					LINK_SYMBOLS: true,
					LINK_CLICK_HERE: true,
					LINK_DOI: {
						dismissAll: true,
					},

						maxLength: 40,
					},
					LINK_LABEL: {
						dismissAll: true,
					},
					LINK_EMPTY: true,
					LINK_IDENTICAL_NAME: {
						dismissAll: true,
					},
					LINK_NEW_TAB: {
						dismissAll: true,
					},

					},
					EMBED_DATA_VIZ: {
						sources: '',
					},
					EMBED_CUSTOM: {
						sources: '#embed_custom',
					},
					EMBED_UNFOCUSABLE: true,
					EMBED_MISSING_TITLE: true,
					EMBED_GENERAL: true,

						sources: '[href*="tugboatqa.com"]',

					QA_STRONG_ITALICS: true,
					QA_IN_PAGE_LINK: true,

						//sources: '',
						dismissAll: true,

					QA_FAKE_HEADING: true,

					META_MAX: true,
